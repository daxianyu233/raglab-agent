name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Source and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            --index-url https://download.pytorch.org/whl/cpu \
            "torch==2.13.0+cpu"

      - name: Install project dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python source syntax
        run: python -m compileall -q raglab scripts

      - name: Check browser JavaScript syntax
        run: node --check raglab/api/static/app.js

      - name: Run FastAPI contract tests
        run: python -m pytest tests/test_api.py -q -p no:cacheprovider

  docker-build:
    name: Docker build
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: raglab-agent:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
