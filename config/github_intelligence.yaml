# 本地采集日期和快照日期使用北京时间。
timezone: "Asia/Shanghai"

github:
  # GitHub 官方 REST API 地址。
  api_base_url: "https://api.github.com"

  # GitHub REST API 版本。
  api_version: "2022-11-28"

  # 单次请求超时时间，单位为秒。
  request_timeout_seconds: 20

  # 网络错误或 GitHub 临时错误时的最大重试次数。
  max_retries: 3

  # 重试等待时间的基础值。
  retry_base_seconds: 2

  # GitHub Trending 网页采集设置。
  trending:
    enabled: true

    # 可选值：daily、weekly、monthly。
    since: "daily"

    # 空字符串表示不限制项目描述使用的自然语言。
    spoken_language_code: ""

  # GitHub Repository Search API 设置。
  search:
    enabled: true

    # 只搜索最近 7 天仍有代码推送的项目。
    lookback_days: 7

    # 每个查询最多返回 8 个仓库。
    # 当前共 5 组基础查询，最多产生 40 条搜索结果。
    per_query: 8

    # 第一阶段仍然按照仓库总 Star 数排序。
    sort: "stars"
    order: "desc"

    # 不同搜索请求之间的等待时间，单位为秒。
    delay_seconds: 1.0

    # 当前固定基础搜索词。
    # 后续会在这些基础词之外加入动态关键词。
    queries:
      - name: "ai-agent"
        query: "topic:ai-agent pushed:>{since} archived:false"

      - name: "rag"
        query: "topic:rag pushed:>{since} archived:false"

      - name: "mcp"
        query: "topic:model-context-protocol pushed:>{since} archived:false"

      - name: "browser-agent"
        query: "\"browser agent\" in:name,description,readme pushed:>{since} archived:false"

      - name: "llm-application"
        query: "\"llm application\" in:name,description,readme pushed:>{since} archived:false"

  # 对候选仓库调用仓库详情 API。
  repository_details:
    enabled: true

    # 每天最多对 30 个候选仓库补全详细元数据。
    max_repositories: 30

    # 仓库详情请求之间的等待时间。
    delay_seconds: 0.15


# 每日候选仓库筛选规则。
selection:
  enabled: true

  # 最多有 15 个仓库进入后续深度采集和分析。
  daily_processing_limit: 15

  # 最多选择 8 个 Trending 项目。
  trending_limit: 8

  # 搜索结果最多占用 5 个位置。
  search_limit: 5

  # 最多重新处理 2 个发生明显变化的旧项目。
  revisit_limit: 2

  # 搜索结果中为新方向保留 2 个探索位置。
  exploration_slots: 2

  # 同一个项目完成深度分析后，
  # 7 天内没有明显变化时不再重复分析。
  cooldown_days: 7

  # Star 绝对增量达到 50 时，
  # 可以触发旧项目重新分析。
  minimum_star_growth: 50

  # Star 相对增长率达到 5% 时，
  # 也可以触发旧项目重新分析。
  minimum_star_growth_rate: 0.05

  # 项目首次进入 Trending 时允许重新分析。
  process_on_new_trending: true

  # 项目首次命中新的查询主题时允许重新分析。
  process_on_new_query: true

  # 第一次发现的项目优先进入处理名单。
  prioritize_new_repositories: true


# 第二阶段：入选项目的深度信息采集配置。
deep_collection:
  enabled: true

  # 从当天筛选结果中最多读取多少个项目。
  # 原则上与 daily_processing_limit 保持一致。
  maximum_repositories: 15

  # 是否获取 README。
  readme:
    enabled: true

    # 原始 README 仍会完整保存在单独的原始数据文件中。
    # 这里控制后续用于规则处理和 LLM 分析的最大字符数。
    maximum_characters: 18000

    # README 超过上限时，保留开头和结尾。
    # 开头通常包含项目定位和主要功能，
    # 结尾可能包含路线图、引用、许可证等信息。
    head_ratio: 0.8

  # 是否获取近期 Release。
  releases:
    enabled: true

    # 每个仓库最多获取最近 3 条 Release。
    maximum_items: 3

    # 每条 Release 的正文最多保留 4000 个字符。
    maximum_body_characters: 4000

  # 是否获取 Issue。
  issues:
    enabled: true

    # 每个仓库最多保留 5 条 Issue。
    maximum_items: 5

    # 只查询最近 30 天更新过的 Issue。
    lookback_days: 30

    # 每条 Issue 正文最多保留 3000 个字符。
    maximum_body_characters: 3000

    # 当前优先获取评论数量较高的 Issue。
    sort: "comments"
    direction: "desc"
    state: "all"

  # 当前暂时不采集 Discussion。
  # 下一步会单独通过 GitHub GraphQL API 实现。
  discussions:
    enabled: false
    maximum_items: 3
    lookback_days: 30
    maximum_body_characters: 3000

  # 不同仓库之间的等待时间，避免短时间请求过密。
  repository_delay_seconds: 0.3

  # 同一个仓库内部，不同 API 请求之间的等待时间。
  request_delay_seconds: 0.15


# 数据保存位置。
paths:
  # 第一阶段原始数据目录。
  raw_root: "data/intelligence/raw"

  # 第二阶段深度采集结果目录。
  deep_raw_root: "data/intelligence/deep"

  # SQLite 数据库位置。
  database: "storage/intelligence/github_intelligence.sqlite3"


# 终端输出配置。
output:
  top_n: 15